name: Build CV

# Overleaf is the source of truth for the LaTeX in cv/.
# Pull it in with scripts/sync-cv.sh; this workflow turns it into cv.pdf at the
# repo root, which is what index.html links to.

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - '.github/workflows/cv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Leave empty to auto-detect the file holding \documentclass.
      # Set it (e.g. cv/main.tex) if the project ever has more than one.
      ROOT_TEX: ''
    steps:
      - uses: actions/checkout@v4

      - name: Locate root .tex
        id: root
        run: |
          if [ ! -d cv ]; then
            echo "::notice::cv/ is not present yet; run scripts/sync-cv.sh to import the Overleaf source."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root="$ROOT_TEX"
          if [ -z "$root" ]; then
            matches="$(grep -rl --include='*.tex' '\\documentclass' cv | sort)"
            count="$(printf '%s' "$matches" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly one .tex with \\documentclass under cv/, found $count. Set ROOT_TEX in this workflow."
              printf '%s\n' "$matches"
              exit 1
            fi
            root="$matches"
          fi
          echo "file=$root" >> "$GITHUB_OUTPUT"
          echo "pdf=$(dirname "$root")/$(basename "$root" .tex).pdf" >> "$GITHUB_OUTPUT"
          echo "Root file: $root"

      - name: Pin build date to the source
        if: steps.root.outputs.skip != 'true'
        # Makes the PDF reproducible, so an unchanged CV produces no commit.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- cv)" >> "$GITHUB_ENV"

      - uses: xu-cheng/latex-action@v4
        if: steps.root.outputs.skip != 'true'
        with:
          root_file: ${{ steps.root.outputs.file }}
          os: debian
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
        env:
          FORCE_SOURCE_DATE: '1'

      - name: Publish as cv.pdf
        if: steps.root.outputs.skip != 'true'
        run: |
          test -f "${{ steps.root.outputs.pdf }}"
          cp "${{ steps.root.outputs.pdf }}" cv.pdf

      - uses: actions/upload-artifact@v4
        if: steps.root.outputs.skip != 'true'
        with:
          name: cv
          path: cv.pdf

      - name: Commit cv.pdf
        if: steps.root.outputs.skip != 'true'
        run: |
          if git diff --quiet -- cv.pdf; then
            echo "cv.pdf unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.pdf
          git commit -m 'build cv.pdf from LaTeX source'
          git push
